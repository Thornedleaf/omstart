<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omstart Out of the Void</title>
    <link rel="stylesheet" href="index.css">
    <script src="test.js" defer></script>
</head>
<body>
    <header>
        <h1>Omstart Out of the Void</h1>
    <nav>
        <a class="nav-btn" href="index.html">Home</a>
        <a class="nav-btn" href="test.html">Test</a>
        <a class="nav-btn" href="contact.html">Contact</a>
        </nav>
    </header>
        <p>Testsidan funkar.</p>
    <div id="counterBadge" class="hidden">0</div>
    <div class="test-container">    
        <button id="startTestBtn" class="nav-btn">Start Test</button>
        <div class="image-row">
            <div id="imageContainer"></div>
            <div id="numberPanel" class="hidden">
                <h3>Press the number you can see in the image to the left.</h3>
                <div class="panel-row">
                    <button class="numberBtn nav-btn" id="randomBtn1"></button>
                    <button class="numberBtn nav-btn" id="indexBtn"></button>
                    <button class="numberBtn nav-btn" id="randomBtn2"></button>
                </div>
                <div class="panel-next">
                    <button id="nextBtn" class="nav-btn hidden">Next</button>
                </div>
            </div>
        </div>
        <div class="nav-buttons">
            <button id="lastBtn" class="nav-btn hidden">Back</button>
        </div>
    </div>
    
    <div id="resultsListContainer" class="results-list-container">
        <h2>Previous Results</h2>
        <ul id="resultsList" class="results-list"></ul>
    </div>
    <div id="completionModal" class="modal hidden">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <div id="modalMessage"></div>
            <div style="margin-top:12px;text-align:center;">
                <button id="modalCloseBtn" class="nav-btn">Close</button>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 Out of the Void Inc. All rights reserved.</p>
    </footer>

</html>
